name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ml-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-powered-nids/ml_engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the python:3.11-slim image used in docker-compose.yml.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-powered-nids/ml_engine/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
